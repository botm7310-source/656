<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب | توصيل طعام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#FF5A1F;
  --primary-dark:#E04A12;
  --primary-soft:#FFF0E8;
  --ink:#1B1A22;
  --muted:#8A8699;
  --bg:#FAF7F3;
  --line:#EFEAE3;
  --green:#12945A;
  --radius:20px;
  --shadow:0 8px 24px rgba(27,26,34,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#EFE9E1;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:460px;margin:0 auto;min-height:100vh;
  background:var(--bg);position:relative;overflow-x:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.08);
  padding-bottom:100px;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input{font-family:inherit}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.wrap{padding:0 18px}

/* ============ SCREENS ============ */
.screen{display:none}
.screen.active{display:block;animation:fadeUp .32s cubic-bezier(.4,0,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ HOME ============ */
.home-head{padding:20px 18px 14px;background:linear-gradient(180deg,#FFF6EE 0%,#FAF7F3 100%)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.loc{font-size:16px;font-weight:700;margin-top:2px}
.avatar{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:#fff;box-shadow:var(--shadow);font-size:20px;flex-shrink:0;
}
.search{
  margin-top:16px;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);
  border:1.5px solid transparent;transition:.25s;
}
.search:focus-within{border-color:var(--primary);box-shadow:0 8px 24px rgba(255,90,31,.14)}
.search input{flex:1;border:none;outline:none;font-size:14.5px;background:transparent;color:var(--ink)}
.search input::placeholder{color:#B5B0C0}

.banner{
  margin:16px 18px 0;border-radius:22px;padding:18px 20px;
  background:linear-gradient(120deg,#FF8A3D 0%,#FF5A1F 60%,#E04A12 100%);
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 12px 26px rgba(255,90,31,.28);
}
.banner h3{font-size:17px;font-weight:800;margin-bottom:4px}
.banner p{font-size:12.5px;opacity:.9}
.banner::after{
  content:'🛵';position:absolute;left:-6px;bottom:-14px;font-size:74px;opacity:.22;
  transform:scaleX(-1);
}

.chips{display:flex;gap:9px;overflow-x:auto;padding:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:9px 17px;border-radius:99px;background:#fff;
  font-size:13.5px;font-weight:600;color:#5C5769;box-shadow:0 2px 10px rgba(27,26,34,.05);
  transition:.22s;border:1.5px solid transparent;
}
.chip.active{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(27,26,34,.24)}

.section-title{display:flex;align-items:center;justify-content:space-between;padding:0 18px 12px}
.section-title h2{font-size:17px;font-weight:800}

/* restaurant card */
.rest-card{
  display:flex;gap:13px;background:#fff;border-radius:var(--radius);padding:11px;
  margin:0 18px 12px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}
.rest-card:active{transform:scale(.975);box-shadow:0 4px 14px rgba(27,26,34,.08)}
.thumb{
  width:94px;height:94px;border-radius:15px;flex-shrink:0;
  display:grid;place-items:center;font-size:42px;
}
.rest-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rest-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rest-info h3{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{font-size:12px;font-weight:700;color:#E8A317;background:#FFF8E6;padding:3px 8px;border-radius:8px;flex-shrink:0}
.rest-info p{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pill{font-size:11.5px;background:#F6F2EC;color:#6C6779;padding:4px 10px;border-radius:99px;font-weight:600}
.pill.free{background:#E8F8F0;color:var(--green)}

/* ============ PAGE HEAD ============ */
.page-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 18px;position:sticky;top:0;z-index:30;
  background:rgba(250,247,243,.9);backdrop-filter:blur(14px);
}
.page-head h2{font-size:17px;font-weight:800}
.icon-btn{
  width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;
  box-shadow:var(--shadow);font-size:18px;transition:.2s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92)}

/* ============ RESTAURANT ============ */
.rest-hero{
  height:172px;margin:0 18px;border-radius:24px;position:relative;overflow:hidden;
  display:grid;place-items:center;font-size:82px;
}
.rest-hero .back{
  position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);display:grid;place-items:center;
  font-size:17px;box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.rest-hero .fav{
  position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);display:grid;place-items:center;
  font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.rest-detail{
  background:#fff;border-radius:22px;margin:-30px 26px 0;padding:16px 18px;
  box-shadow:var(--shadow);position:relative;z-index:2;
}
.rest-detail h1{font-size:19px;font-weight:800}
.rest-detail .sub{margin-top:5px}
.stats{display:flex;gap:8px;margin-top:13px}
.stat{
  flex:1;background:#FAF7F3;border-radius:13px;padding:9px 6px;text-align:center;
}
.stat b{display:block;font-size:13.5px;font-weight:800}
.stat span{font-size:10.5px;color:var(--muted)}

.menu-item{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;
  padding:11px;margin:0 18px 11px;box-shadow:var(--shadow);
}
.mi-thumb{
  width:64px;height:64px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;
  font-size:30px;background:#FFF3EA;
}
.mi-info{flex:1;min-width:0}
.mi-info h4{font-size:14.5px;font-weight:700}
.mi-info p{margin-top:3px;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{display:inline-block;margin-top:7px;font-size:13.5px;font-weight:800;color:var(--primary)}
.price small{font-size:10px;font-weight:600;color:var(--muted)}
.add-btn{
  width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;
  font-size:21px;font-weight:400;display:grid;place-items:center;flex-shrink:0;
  transition:.18s;line-height:1;
}
.add-btn:active{transform:scale(.86);background:var(--primary)}
.add-btn.in-cart{background:var(--primary);box-shadow:0 4px 14px rgba(255,90,31,.35)}

/* floating cart */
.float-cart{
  position:fixed;bottom:96px;left:20px;right:20px;max-width:420px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:18px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 12px 30px rgba(27,26,34,.32);z-index:40;cursor:pointer;
  opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s cubic-bezier(.4,0,.2,1);
}
.float-cart.show{opacity:1;transform:translateY(0);pointer-events:auto}
.fc-count{background:var(--primary);width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800}
.float-cart .lbl{flex:1;font-size:14px;font-weight:700}
.fc-total{font-size:14.5px;font-weight:800}

/* ============ CART ============ */
.cart-item{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;
  padding:12px;margin:0 18px 11px;box-shadow:var(--shadow);
}
.qty-ctrl{display:flex;align-items:center;gap:2px;background:#FAF7F3;border-radius:12px;padding:3px}
.qty-ctrl button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink);transition:.15s}
.qty-ctrl button:active{background:#EDE7DE}
.qty-ctrl span{min-width:22px;text-align:center;font-size:13.5px;font-weight:800}

.summary{
  background:#fff;border-radius:20px;padding:18px;margin:6px 18px 16px;box-shadow:var(--shadow);
}
.summary h3{font-size:15px;font-weight:800;margin-bottom:14px}
.srow{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:11px;color:#5C5769}
.srow.total{
  border-top:1.5px dashed var(--line);padding-top:13px;margin-top:3px;margin-bottom:0;
  font-size:16px;font-weight:800;color:var(--ink);
}
.srow.total b{color:var(--primary)}

.btn{
  display:block;width:calc(100% - 36px);margin:0 18px;padding:16px;border-radius:17px;
  background:linear-gradient(120deg,#FF7A38,#FF5A1F);color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 10px 24px rgba(255,90,31,.32);transition:.2s;text-align:center;
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;box-shadow:none;pointer-events:none}

/* empty */
.empty{text-align:center;padding:70px 30px}
.empty .em{font-size:64px;display:block;margin-bottom:16px;opacity:.85}
.empty h3{font-size:16px;font-weight:800;margin-bottom:7px}
.empty p{font-size:13px;color:var(--muted);line-height:1.7}

/* ============ TRACKING ============ */
.track-card{
  background:linear-gradient(160deg,#221F2E 0%,#17151F 100%);color:#fff;
  border-radius:24px;padding:20px;margin:0 18px 14px;
  box-shadow:0 16px 34px rgba(27,26,34,.28);
}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start}
.tc-top .lbl{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:4px}
.tc-top h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.live{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  background:rgba(32,178,107,.15);color:#4ADE9B;padding:6px 11px;border-radius:99px;
}
.pulse{width:7px;height:7px;border-radius:50%;background:#4ADE9B;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

.track{position:relative;height:9px;background:rgba(255,255,255,.13);border-radius:99px;margin:40px 16px 12px}
.fill{
  position:absolute;right:0;top:0;height:100%;width:var(--p,8%);border-radius:99px;
  background:linear-gradient(to left,#FFB067,#FF5A1F);
  transition:width .9s cubic-bezier(.4,0,.2,1);
}
.scooter{
  position:absolute;top:-26px;right:var(--p,8%);transform:translateX(50%);
  font-size:25px;transition:right .9s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 4px 8px rgba(255,90,31,.5));
}
.steps-labels{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.45);font-weight:600;padding:0 2px}
.steps-labels span.on{color:#FFB067}

.status-card{
  display:flex;gap:13px;align-items:center;background:#fff;border-radius:20px;
  padding:16px;margin:0 18px 14px;box-shadow:var(--shadow);
}
.status-icon{
  width:52px;height:52px;border-radius:16px;background:var(--primary-soft);
  display:grid;place-items:center;font-size:25px;flex-shrink:0;
}
.status-card h3{font-size:15px;font-weight:800}
.status-card p{margin-top:4px}

.driver{
  display:flex;align-items:center;gap:13px;background:#fff;border-radius:20px;
  padding:14px;margin:0 18px 14px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(8px);transition:.4s;height:0;padding:0 14px;overflow:hidden;margin-bottom:0;
}
.driver.show{opacity:1;transform:none;height:auto;padding:14px;margin-bottom:14px}
.driver .ph{width:48px;height:48px;border-radius:50%;background:#EDE9FF;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.driver h4{font-size:14px;font-weight:800}
.driver p{font-size:11.5px;color:var(--muted);margin-top:3px}
.call-btn{
  width:42px;height:42px;border-radius:14px;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:17px;flex-shrink:0;
}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;z-index:60;
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;color:#A9A4B8;font-size:10.5px;font-weight:700;position:relative;transition:.2s;
}
.nav-item .ni{font-size:20px;filter:grayscale(1);opacity:.55;transition:.2s}
.nav-item.active{color:var(--primary)}
.nav-item.active .ni{filter:none;opacity:1;transform:translateY(-1px)}
.badge{
  position:absolute;top:0;right:calc(50% - 20px);
  background:var(--primary);color:#fff;font-size:9.5px;font-weight:800;
  min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;
  padding:0 4px;transform:scale(0);transition:.25s cubic-bezier(.34,1.56,.64,1);
}
.badge.show{transform:scale(1)}

/* toast */
#toast{
  position:fixed;bottom:170px;left:50%;transform:translate(-50%,16px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;
  font-size:13px;font-weight:700;opacity:0;pointer-events:none;
  transition:.3s cubic-bezier(.4,0,.2,1);z-index:100;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.28);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="app">

  <!-- ================= HOME ================= -->
  <section class="screen active" id="screen-home">
    <div class="home-head">
      <div class="head-row">
        <div>
          <p class="tiny muted">توصيل إلى</p>
          <h2 class="loc">📍 حي النخيل، الرياض</h2>
        </div>
        <div class="avatar">👤</div>
      </div>
      <div class="search">
        <span>🔍</span>
        <input id="searchInput" placeholder="ابحث عن مطعم أو طبق..." oninput="onSearch(this.value)">
      </div>
    </div>

    <div class="banner">
      <h3>🎉 توصيل مجاني</h3>
      <p>على جميع الطلبات فوق 100 ر.س — اليوم فقط</p>
    </div>

    <div class="chips" id="chips"></div>

    <div class="section-title">
      <h2>المطاعم القريبة</h2>
      <span class="small muted" id="restCount"></span>
    </div>

    <div id="restList"></div>
    <div style="height:20px"></div>
  </section>

  <!-- ================= RESTAURANT ================= -->
  <section class="screen" id="screen-restaurant">
    <div id="restHeroWrap"></div>
    <div id="restDetailWrap"></div>
    <div class="section-title" style="padding-top:20px"><h2>قائمة الأطباق</h2></div>
    <div id="menuList"></div>
    <div style="height:20px"></div>
  </section>

  <!-- ================= CART ================= -->
  <section class="screen" id="screen-cart">
    <div class="page-head">
      <button class="icon-btn" onclick="go('home')">←</button>
      <h2>سلة الطلبات</h2>
      <div style="width:42px"></div>
    </div>
    <div id="cartBody"></div>
  </section>

  <!-- ================= TRACKING ================= -->
  <section class="screen" id="screen-track">
    <div class="page-head">
      <button class="icon-btn" onclick="go('home')">←</button>
      <h2>تتبع الطلب</h2>
      <div style="width:42px"></div>
    </div>
    <div id="trackBody"></div>
  </section>

  <!-- floating cart -->
  <div class="float-cart" id="floatCart" onclick="go('cart')">
    <span class="fc-count" id="fcCount">0</span>
    <span class="lbl">عرض السلة</span>
    <span class="fc-total" id="fcTotal">0 ر.س</span>
  </div>

  <!-- bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home" onclick="go('home')">
      <span class="ni">🏠</span><span>الرئيسية</span>
    </button>
    <button class="nav-item" data-screen="cart" onclick="go('cart')">
      <span class="ni">🛒</span><span>السلة</span>
      <span class="badge" id="navBadge">0</span>
    </button>
    <button class="nav-item" data-screen="track" onclick="go('track')">
      <span class="ni">🛵</span><span>تتبع</span>
    </button>
  </nav>
</div>

<div id="toast"></div>

    menu:[
      {id:'sh1', name:'شاورما دجاج عربي', desc:'دجاج متبل، ثوم، مخلل، خبز طازج', price:18, emoji:'🌯'},
      {id:'sh2', name:'شاورما لحم', desc:'لحم مشوي، طحينة، بصل', price:24, emoji:'🥙'},
      {id:'sh3', name:'صحن مشاوي مشكل', desc:'كباب، شيش طاووق، كفتة', price:65, emoji:'🍖'},
      {id:'sh4', name:'حمص بالطحينة', desc:'حمص كريمي، زيت زيتون', price:15, emoji:'🥣'}
    ]
  }
];

const CATEGORIES = ['الكل','بيتزا','برجر','سوشي','شاورما'];

const TRACK_STEPS = [
  {t:'تم تأكيد الطلب', d:'استلمنا طلبك وبدأنا بتجهيزه', i:'✅', eta:'25 دقيقة', p:8},
  {t:'المطعم يحضّر طلبك', d:'الشيف يعمل على طلبك الآن 👨‍🍳', i:'👨‍🍳', eta:'18 دقيقة', p:38},
  {t:'المندوب في الطريق إليك', d:'طلبك مع مندوبنا، وصل قريباً 🛵', i:'🛵', eta:'7 دقائق', p:70},
  {t:'تم توصيل طلبك!', d:'بالهناء والشفاء 🎉', i:'🎉', eta:'تم التوصيل', p:100}
];

/* ==================== STATE ==================== */
const state = {
  screen:'home',
  rest:null,
  cart:{},          // itemId -> {item, qty, restId, restName}
  filter:'الكل',
  query:'',
  order:null,
  step:0,
  timer:null
};

/* ==================== HELPERS ==================== */
const $ = id => document.getElementById(id);
const money = n => n + ' ر.س';

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1700);
}

/* ==================== NAVIGATION ==================== */
function go(screen){
  state.screen = screen;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-'+screen).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>
    n.classList.toggle('active', n.dataset.screen === screen)
  );
  if(screen === 'cart') renderCart();
  if(screen === 'track') renderTracking();
  $('floatCart').classList.remove('show');
  if(screen === 'restaurant') updateCart();
  window.scrollTo({top:0, behavior:'instant'});
}

/* ==================== HOME ==================== */
function renderChips(){
  $('chips').innerHTML = CATEGORIES.map(c=>
    `<button class="chip ${state.filter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}

function setFilter(c){
  state.filter = c;
  renderChips();
  renderHome();
}

function onSearch(v){
  state.query = v;
  renderHome();
}

function renderHome(){
  let list = restaurants.filter(r=>{
    const okFilter = state.filter === 'الكل' || r.tags.includes(state.filter);
    const q = state.query.trim();
    const okQuery = !q || r.name.includes(q) || r.tags.includes(q) ||
                    r.menu.some(m => m.name.includes(q));
    return okFilter && okQuery;
  });

  $('restCount').textContent = list.length + ' مطعم';

  if(!list.length){
    $('restList').innerHTML = `
      <div class="empty">
        <span class="em">🔎</span>
        <h3>لا توجد نتائج</h3>
        <p>جرّب البحث بكلمة أخرى أو اختر تصنيفاً مختلفاً</p>
      </div>`;
    return;
  }

  $('restList').innerHTML = list.map(r=>`
    <article class="rest-card" onclick="openRestaurant('${r.id}')">
      <div class="thumb" style="background:linear-gradient(135deg,${r.c1},${r.c2})">${r.emoji}</div>
      <div class="rest-info">
        <div class="rest-top">
          <h3>${r.name}</h3>
          <span class="rating">⭐ ${r.rating}</span>
        </div>
        <p class="muted small">${r.tags}</p>
        <div class="meta">
          <span class="pill">🕒 ${r.time} دقيقة</span>
          <span class="pill ${r.fee===0?'free':''}">🛵 ${r.fee===0?'توصيل مجاني':r.fee+' ر.س'}</span>
        </div>
      </div>
    </article>
  `).join('');
}

/* ==================== RESTAURANT ==================== */
function openRestaurant(id){
  const r = restaurants.find(x=>x.id===id);
  state.rest = r;

  $('restHeroWrap').innerHTML = `
    <div class="rest-hero" style="background:linear-gradient(135deg,${r.c1},${r.c2})">
      ${r.emoji}
      <button class="back" onclick="go('home')">→</button>
      <button class="fav">🤍</button>
    </div>`;

  $('restDetailWrap').innerHTML = `
    <div class="rest-detail">
      <h1>${r.name}</h1>
      <p class="muted small sub">${r.tags}</p>
      <div class="stats">
        <div class="stat"><b>⭐ ${r.rating}</b><span>التقييم</span></div>
        <div class="stat"><b>${r.time} د</b><span>مدة التوصيل</span></div>
        <div class="stat"><b>${r.fee===0?'مجاني':r.fee+' ر.س'}</b><span>رسوم التوصيل</span></div>
      </div>
    </div>`;

  $('menuList').innerHTML = r.menu.map(m=>`
    <div class="menu-item">
      <div class="mi-thumb">${m.emoji}</div>
      <div class="mi-info">
        <h4>${m.name}</h4>
        <p>${m.desc}</p>
        <span class="price">${m.price} <small>ر.س</small></span>
      </div>
      <button class="add-btn" id="add-${m.id}" onclick="addToCart('${r.id}','${m.id}')">+</button>
    </div>
  `).join('');

  go('restaurant');
}

/* ==================== CART LOGIC ==================== */
function addToCart(restId, itemId){
  const r = restaurants.find(x=>x.id===restId);
  const it = r.menu.find(m=>m.id===itemId);

  if(!state.cart[itemId]){
    state.cart[itemId] = {item:it, qty:0, restId, restName:r.name};
  }
  state.cart[itemId].qty++;
  updateCart();

  const btn = $('add-'+itemId);
  if(btn){
    btn.classList.add('in-cart');
    setTimeout(()=>btn.classList.remove('in-cart'), 500);
  }
  toast('تمت إضافة ' + it.name + ' ✓');
}

function changeQty(itemId, delta){
  const e = state.cart[itemId];
  if(!e) return;
  e.qty += delta;
  if(e.qty <= 0) delete state.cart[itemId];
  updateCart();
  renderCart();
}

function cartItems(){ return Object.values(state.cart); }
function cartCount(){ return cartItems().reduce((s,e)=>s+e.qty,0); }
function cartSubtotal(){ return cartItems().reduce((s,e)=>s+e.qty*e.item.price,0); }
function deliveryFee(sub){ return sub === 0 ? 0 : (sub >= 100 ? 0 : 8); }

function updateCart(){
  const count = cartCount();
  const sub = cartSubtotal();

  const badge = $('navBadge');
  badge.textContent = count;
  badge.classList.toggle('show', count > 0);

  const fc = $('floatCart');
  $('fcCount').textContent = count;
  $('fcTotal').textContent = money(sub);

  const showFloat = count > 0 && state.screen === 'restaurant';
  fc.classList.toggle('show', showFloat);
}

/* ==================== CART SCREEN ==================== */
function renderCart(){
  const items = cartItems();
  const body = $('cartBody');

  if(!items.length){
    body.innerHTML = `
      <div class="empty">
        <span class="em">🛒</span>
        <h3>سلتك فارغة</h3>
        <p>أضف بعض الأطباق الشهية<br>وابدأ رحلة الطلب</p>
        <button class="btn" style="margin-top:26px" onclick="go('home')">تصفّح المطاعم</button>
      </div>`;
    return;
  }

  const sub = cartSubtotal();
  const fee = deliveryFee(sub);
  const total = sub + fee;

  body.innerHTML = `
    ${items.map(e=>`
      <div class="cart-item">
        <div class="mi-thumb" style="width:56px;height:56px;font-size:26px">${e.item.emoji}</div>
        <div class="mi-info">
          <h4>${e.item.name}</h4>
          <p>${e.restName}</p>
          <span class="price">${e.item.price * e.qty} <small>ر.س</small></span>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeQty('${e.item.id}', 1)">+</button>
          <span>${e.qty}</span>
          <button onclick="changeQty('${e.item.id}', -1)">−</button>
        </div>
      </div>
    `).join('')}

    <div class="summary">
      <h3>ملخص الفاتورة</h3>
      <div class="srow"><span>المجموع الفرعي</span><span>${money(sub)}</span></div>
      <div class="srow">
        <span>رسوم التوصيل</span>
        <span style="color:${fee===0?'var(--green)':'inherit'};font-weight:${fee===0?'800':'500'}">
          ${fee===0 ? 'مجاني 🎉' : money(fee)}
        </span>
      </div>
      ${fee>0 ? `<div class="srow" style="font-size:11.5px;color:var(--muted)">
        أضف ${money(100-sub)} للحصول على توصيل مجاني
      </div>` : ''}
      <div class="srow total"><span>الإجمالي</span><b>${money(total)}</b></div>
    </div>

    <button class="btn" onclick="checkout()">تأكيد الطلب • ${money(total)}</button>
    <div style="height:24px"></div>
  `;
}

/* ==================== CHECKOUT ==================== */
function checkout(){
  const items = cartItems();
  if(!items.length) return;

  const sub = cartSubtotal();
  const total = sub + deliveryFee(sub);

  state.order = {
    num: '#' + Math.floor(100000 + Math.random()*900000),
    items: items.map(e=>({name:e.item.name, emoji:e.item.emoji, qty:e.qty, price:e.item.price})),
    total
  };
  state.cart = {};
  state.step = 0;

  updateCart();
  go('track');
  startTracking();
  toast('تم إرسال طلبك بنجاح 🎉');
}

/* ==================== TRACKING ==================== */
function renderTracking(){
  const body = $('trackBody');

  if(!state.order){
    body.innerHTML = `
      <div class="empty">
        <span class="em">🛵</span>
        <h3>لا يوجد طلب نشط</h3>
        <p>بعد تأكيد طلبك ستتمكن من<br>تتبع حالته لحظة بلحظة</p>
        <button class="btn" style="margin-top:26px" onclick="go('home')">اطلب الآن</button>
      </div>`;
    return;
  }

  const s = TRACK_STEPS[state.step];

  body.innerHTML = `
    <div class="track-card">
      <div class="tc-top">
        <div>
          <p class="lbl">وقت الوصول المتوقع</p>
          <h1>${s.eta}</h1>
        </div>
        <div class="live"><span class="pulse"></span> مباشر</div>
      </div>

      <div class="track" id="trackBar" style="--p:${s.p}%">
        <div class="fill" style="width:${s.p}%"></div>
        <div class="scooter" style="right:${s.p}%">🛵</div>
      </div>

      <div class="steps-labels">
        ${TRACK_STEPS.map((st,i)=>
          `<span class="${i<=state.step?'on':''}">${st.t.split(' ').slice(-1)[0]}</span>`
        ).join('')}
      </div>
    </div>

    <div class="status-card">
      <div class="status-icon">${s.i}</div>
      <div>
        <h3>${s.t}</h3>
        <p class="muted small">${s.d}</p>
      </div>
    </div>

    <div class="driver ${state.step>=2?'show':''}">
      <div class="ph">🧑‍✈️</div>
      <div style="flex:1;min-width:0">
        <h4>فهد العتيبي</h4>
        <p>مندوب التوصيل • ⭐ 4.9</p>
      </div>
      <button class="call-btn" onclick="toast('جارٍ الاتصال بالمندوب...')">📞</button>
    </div>

    <div class="summary">
      <h3>تفاصيل الطلب ${state.order.num}</h3>
      ${state.order.items.map(it=>`
        <div class="srow">
          <span>${it.emoji} ${it.name} × ${it.qty}</span>
          <span>${it.price * it.qty} ر.س</span>
        </div>
      `).join('')}
      <div class="srow total"><span>الإجمالي المدفوع</span><b>${money(state.order.total)}</b></div>
    </div>

    ${state.step >= 3
      ? `<button class="btn" onclick="resetOrder()">طلب جديد</button>`
      : `<button class="btn ghost" onclick="go('home')">متابعة التصفح</button>`}
    <div style="height:24px"></div>
  `;
}

function startTracking(){
  clearInterval(state.timer);
  state.timer = setInterval(()=>{
    if(state.step < 3){
      state.step++;
      renderTracking();
      if(state.step === 3){
        clearInterval(state.timer);
        toast('وصل طلبك! بالهناء والشفاء 🎉');
      }
    }
  }, 5000);
}

function resetOrder(){
  clearInterval(state.timer);
  state.order = null;
  state.step = 0;
  go('home');
}

/* ==================== INIT ==================== */
renderChips();
renderHome();
updateCart();
</script>
</body>
</html>
